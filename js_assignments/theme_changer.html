<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Changer</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: 0.5s;
            background-color: white;
            color: black;
        }

        .container{
            text-align: center;
        }

        h1{
            margin-bottom: 15px;
            font-size: 38px;
        }

        p{
            margin-bottom: 30px;
            font-size: 17px;
            line-height: 1.6;
        }

        button{
            padding: 12px 28px;
            border: none;
            border-radius: 30px;
            font-size: 17px;
            cursor: pointer;
            background-color: #222;
            color: white;
            transition: 0.5s;
        }

        .dark{
            background-color: #222;
            color: white;
        }

        .dark button{
            background-color: white;
            color: #222;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Theme Changer</h1>

        <p>
            Click the button to switch the theme.
        </p>

        <button id="themeBtn">Toggle Theme</button>
    </div>

    <script>

        const btn = document.querySelector("#themeBtn");

        btn.addEventListener("click", function () {
            document.body.classList.toggle("dark");
        });
    </script>

</body>
</html>
