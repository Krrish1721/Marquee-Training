<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Dynamic Card</title>
    <style>
        body{
            background-color: rgb(165,175,186);
            font-family: Arial, sans-serif;

        }

        .card-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            width: 300px;
            min-height: 400px;
            background-color: rgb(255, 255, 255);
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            margin: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .card p{
            margin: 5px 0;
            font-size: 16px;
            color: #333;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 10px;
        }


    </style>
</head>
<body>
    <h1>Card Demo</h1>
    <div class="card-container">
        <!-- INSERT CARDS HERE -->
    </div>

    <script>
        const products = [

            {
                name: "Laptop",
                brand: "Dell",
                price: "₹65,000",
                category: "Electronics",
                image: "images/laptop.jpg"
            },

            {
                name: "iPhone",
                brand: "Apple",
                price: "₹80,000",
                category: "Mobile",
                image: "images/iphone.jpg"
            },

            {
                name: "Shoes",
                brand: "Nike",
                price: "₹4,000",
                category: "Fashion",
                image: "images/shoes.jpg"
            },

            {
                name: "Headphones",
                brand: "Boat",
                price: "₹5,500",
                category: "Electronics",
                image: "images/headphones.jpg"
            },

            {
                name: "Watch",
                brand: "Titan",
                price: "₹3,500",
                category: "Accessories",
                image: "images/watch.jpg"
            }
        ];

    let container = document.querySelector('.card-container');
    
    products.forEach(product => {
        let card = document.createElement('div');
        card.className = 'card';

        card.innerHTML = `
            <img src="${product.image}" alt="${product.name}">

            <h2>${product.name}</h2>
            <p>Brand: ${product.brand}</p>
            <p><strong>Price: ${product.price}</strong></p>
            <p>Category: ${product.category}</p>
        `;
        container.appendChild(card);
    })
    </script>
</body>
</html>
